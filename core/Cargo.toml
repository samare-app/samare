# SPDX-License-Identifier: GPL-3.0-or-later

[workspace]
resolver = "3"
members = ["samare-core", "samare-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/cedricvoinnet/samare"
publish = false

[workspace.dependencies]
samare-core = { path = "samare-core" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
