# SPDX-License-Identifier: GPL-3.0-or-later

name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/THREAT_MODEL.md
      - scripts/build-site.sh
      - scripts/og-cards.py
      - scripts/check-site.py
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - docs/THREAT_MODEL.md
      - scripts/build-site.sh
      - scripts/og-cards.py
      - scripts/check-site.py
      - .github/workflows/site.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publish halfway through.
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.6"
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"
  # Draws the share cards (scripts/og-cards.py).
  RESVG_VERSION: "0.49.0"
  RESVG_SHA256: "216637e75e909e53e3098b0875cd5f7da2fdc8b4359771b4a29b539afff9d3f5"

jobs:
  site:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zola
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/zola-v$ZOLA_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZOLA_SHA256  $RUNNER_TEMP/zola.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP" zola
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install resvg
        run: |
          curl -fsSL -o "$RUNNER_TEMP/resvg.tar.gz" \
            "https://github.com/linebender/resvg/releases/download/v$RESVG_VERSION/resvg-linux-x86_64.tar.gz"
          echo "$RESVG_SHA256  $RUNNER_TEMP/resvg.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/resvg.tar.gz" -C "$RUNNER_TEMP" resvg
      - run: scripts/build-site.sh
      # No script and no resource from another domain in what gets published.
      - run: python3 -I scripts/check-site.py site
      # git-pages serves the "pages" branch of the Codeberg repository,
      # pulled on each push through a webhook. Skipped until the repository
      # is set up (variable CODEBERG_PAGES_REPO, secret CODEBERG_DEPLOY_KEY).
      - name: Publish to Codeberg Pages
        if: github.event_name == 'push' && vars.CODEBERG_PAGES_REPO != ''
        env:
          DEPLOY_KEY: ${{ secrets.CODEBERG_DEPLOY_KEY }}
          PAGES_REPO: ${{ vars.CODEBERG_PAGES_REPO }}
        working-directory: site/public
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Published at https://docs.codeberg.org/security/ssh-fingerprint/
          echo "codeberg.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVIC02vnjFyL+I4RHfvIGNtOgJMe769VTF1VR4EB3ZB" > ~/.ssh/known_hosts
          git init -q -b pages
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish $GITHUB_SHA"
          git push --force "$PAGES_REPO" pages
